name: Renombrar a index.html

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/renombrar-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renombrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renombrar a index.html
        run: |
          if [ ! -f tarot-interactivo-rider-waite.html ]; then
            echo "No existe el archivo a renombrar"
            exit 0
          fi
          git config user.name "inovation2030"
          git config user.email "inovation2030@users.noreply.github.com"
          git mv -f tarot-interactivo-rider-waite.html index.html
          git commit -m "Envío por fetch con alias FormSubmit, sin correo visible"
          git push
