name: Rename tarot file to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "inovation2030"
          git config user.email "inovation2030@users.noreply.github.com"
          git mv tarot-interactivo-rider-waite.html index.html
          git commit -m "Rename tarot-interactivo-rider-waite.html to index.html"
          git push
